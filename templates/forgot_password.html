{% extends "base.html" %}

{% block title %}Reset Password — Auth Service{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="brand">
    <span class="brand-name">Auth Service</span>
    <h1 class="brand-heading">Reset your password</h1>
  </div>

  <div class="card">
    <form class="form" id="resetForm" novalidate>
      <div class="error-message" id="errorBanner">
        <svg class="error-icon" viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 1a7 7 0 100 14A7 7 0 008 1zm-.75 4a.75.75 0 011.5 0v3.5a.75.75 0 01-1.5 0V5zm.75 6.5a.875.875 0 100-1.75.875.875 0 000 1.75z"/>
        </svg>
        <span id="errorText"></span>
      </div>

      <div class="success-message" id="successBanner">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 1a7 7 0 100 14A7 7 0 008 1zm3.22 5.97l-3.5 3.5a.75.75 0 01-1.06 0l-1.5-1.5a.75.75 0 111.06-1.06l.97.97 2.97-2.97a.75.75 0 011.06 1.06z"/>
        </svg>
        <span id="successText"></span>
      </div>

      <p class="form-description">Enter your email address and we'll send you a link to reset your password.</p>

      <div class="field">
        <label for="email">Email address</label>
        <div class="input-wrapper">
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">
        <span class="btn-text">Send reset link</span>
        <span class="spinner"></span>
      </button>
    </form>
  </div>

  <p class="footer-text">
    Remember your password? <a href="/login">Sign in</a>
  </p>
</div>

<style>
  .form-description {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.5;
  }
</style>

<script>
  var form = document.getElementById('resetForm');
  var emailInput = document.getElementById('email');
  var submitBtn = document.getElementById('submitBtn');
  var errorBanner = document.getElementById('errorBanner');
  var errorText = document.getElementById('errorText');
  var successBanner = document.getElementById('successBanner');
  var successText = document.getElementById('successText');

  emailInput.addEventListener('input', function() {
    emailInput.classList.remove('error');
    errorBanner.classList.remove('visible');
  });

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    errorBanner.classList.remove('visible');
    successBanner.classList.remove('visible');

    var email = emailInput.value.trim();
    if (!email) {
      emailInput.classList.add('error');
      showError('Please enter your email address');
      return;
    }

    submitBtn.classList.add('loading');
    submitBtn.disabled = true;

    fetch('/api/v1/auth/password-reset/request', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email })
    })
    .then(function(res) { return res.json().then(function(data) { return { ok: res.ok, data: data }; }); })
    .then(function(result) {
      if (!result.ok) {
        showError(result.data.detail || 'Something went wrong');
        return;
      }
      successText.textContent = 'If an account with that email exists, we sent a password reset link.';
      successBanner.classList.add('visible');
      form.querySelector('.field').style.display = 'none';
      submitBtn.style.display = 'none';
    })
    .catch(function() {
      showError('Unable to connect to the server');
    })
    .finally(function() {
      submitBtn.classList.remove('loading');
      submitBtn.disabled = false;
    });
  });

  function showError(msg) {
    errorText.textContent = msg;
    errorBanner.classList.add('visible');
  }
</script>
{% endblock %}
